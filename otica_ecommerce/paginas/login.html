<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Ótica E-commerce</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 2px 2px 12px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; color: #666; margin-bottom: 5px; font-size: 14px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        .btn-entrar { background-color: #27ae60; color: white; }
        .btn-entrar:hover { background-color: #219653; }
        .btn-cadastrar { background-color: #2980b9; color: white; }
        .btn-cadastrar:hover { background-color: #2471a3; }
        .mensagem { padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; }
        .erro { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .sucesso { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .voltar { display: block; margin-top: 15px; color: #7f8c8d; text-decoration: none; font-size: 14px; }
        .voltar:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Acessar a Ótica</h2>

        {% if erro_msg %}
            <div class="mensagem erro">{{ erro_msg }}</div>
        {% endif %}
        {% if sucesso_msg %}
            <div class="mensagem sucesso">{{ sucesso_msg }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="input-group">
                <label for="username">Usuário (Nome)</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" name="action" value="entrar" class="btn btn-entrar">Entrar</button>
            <button type="submit" name="action" value="cadastrar" class="btn btn-cadastrar">Cadastrar Nova Conta</button>
        </form>

        <a href="/" class="voltar">← Voltar para a Vitrine</a>
    </div>

</body>
</html>
