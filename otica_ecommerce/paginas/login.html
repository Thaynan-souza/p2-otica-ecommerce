<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Ótica E-commerce</title>
    <link rel="stylesheet" href="/static/login.css">
</head>
<body>

    <div class="caixa-central">
        <h2>Acessar a Ótica</h2>

        {% if erro_msg %}
            <div class="mensagem erro">{{ erro_msg }}</div>
        {% endif %}
        {% if sucesso_msg %}
            <div class="mensagem sucesso">{{ sucesso_msg }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="input-group">
                <label for="username">Usuário (Nome)</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" name="action" value="entrar" class="btn btn-entrar">Entrar</button>
            <button type="submit" name="action" value="cadastrar" class="btn btn-cadastrar">Cadastrar Nova Conta</button>
        </form>

        <a href="/" class="link-voltar">← Voltar para a Vitrine</a>
    </div>

</body>
</html>
