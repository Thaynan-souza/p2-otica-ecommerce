<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pagamento - Ótica</title>
    <link rel="stylesheet" href="/static/pagamento.css">
</head>
<body>
    <div class="caixa-central">
        <h2>Efetuar Pagamento</h2>
        <div class="preco-destaque">R$ {{ "%.2f"|format(total) }}</div>
        
        <form action="/pagamento" method="POST">
            
            <div class="forma-pagamento">
                <p>Selecione a forma de pagamento:</p>
                
                <label class="opcao-radio">
                    <input type="radio" name="forma" value="pix" onclick="mostrarCartao(false)" checked> 📱 Pix
                </label>
                
                <label class="opcao-radio">
                    <input type="radio" name="forma" value="boleto" onclick="mostrarCartao(false)"> 📄 Boleto Bancário
                </label>
                
                <label class="opcao-radio">
                    <input type="radio" name="forma" value="cartao" onclick="mostrarCartao(true)"> 💳 Cartão de Crédito
                </label>
            </div>

            <div id="dados-cartao" class="input-group">
                <label>Número do Cartão:</label>
                <input type="text" placeholder="0000 0000 0000 0000">
                <label>Nome no Cartão:</label>
                <input type="text" placeholder="JOÃO M SILVA">
                
                <div class="linha-dupla">
                    <div class="campo-metade">
                        <label>Validade:</label>
                        <input type="text" placeholder="MM/AA">
                    </div>
                    <div class="campo-metade">
                        <label>CVV:</label>
                        <input type="text" placeholder="123">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-finalizar">Confirmar e Finalizar</button>
        </form>
        <a href="/carrinho" class="link-voltar">Voltar ao Carrinho</a>
    </div>

    <script>
        function mostrarCartao(mostrar) {
            document.getElementById('dados-cartao').style.display = mostrar ? 'block' : 'none';
        }
    </script>
</body>
</html>
