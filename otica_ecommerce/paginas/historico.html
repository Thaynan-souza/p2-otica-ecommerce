<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minhas Compras</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 8px; max-width: 700px; margin: 0 auto; box-shadow: 2px 2px 8px rgba(0,0,0,0.1); }
        .item-pedido { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .item-pedido:last-child { border-bottom: none; }
        .nome { font-weight: bold; color: #333; }
        .preco { color: #27ae60; font-weight: bold; }
        .data { color: #95a5a6; font-size: 13px; }
        .btn { background: #2980b9; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Histórico de Compras - {{ usuario }}</h2>
        
        {% if compras %}
            {% for c in compras %}
            <div class="item-pedido">
                <div>
                    <div class="nome">{{ c.nome_produto }}</div>
                    <div class="data">Comprado em: {{ c.data_pedido }}</div>
                </div>
                <div class="preco">R$ {{ "%.2f"|format(c.preco) }}</div>
            </div>
            {% endfor %}
        {% else %}
            <p>Você ainda não realizou nenhuma compra na nossa ótica.</p>
        {% endif %}
        
        <a href="/" class="btn">Voltar para a Loja</a>
    </div>
</body>
</html>
